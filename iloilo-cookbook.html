<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lutô Iloilo – The Iloilo City Cookbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600&display=swap">
<style>
:root{--bg:#f4f8f8;--surface:#fff;--ink:#12293b;--muted:#5b7080;--line:#d9e3e6;--brand:#0f4c5c;--brand-ink:#fff;--gold:#e8a317;--chili:#c8452b;--leaf:#3b7a57;--side-w:250px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1b24;--surface:#14293a;--ink:#e8f0f3;--muted:#9bb0bd;--line:#26414f;--brand:#5cc3d6;--brand-ink:#08222b}}
:root[data-theme="dark"]{--bg:#0d1b24;--surface:#14293a;--ink:#e8f0f3;--muted:#9bb0bd;--line:#26414f;--brand:#5cc3d6;--brand-ink:#08222b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 Figtree,system-ui,sans-serif}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.15;margin:0 0 .5em}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--side-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);padding:1.25rem 1rem;display:flex;flex-direction:column;gap:1.25rem;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:20}
.side-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:.75rem;border-bottom:1px solid var(--line)}
.logo{font:700 1.3rem Fraunces,Georgia,serif;text-decoration:none}
.close-side{display:none}
nav{display:flex;flex-direction:column;gap:.35rem}
nav a{padding:.6rem .9rem;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:.55rem;transition:background .15s,color .15s}
nav a.on,nav a:hover{background:var(--brand);color:var(--brand-ink)}
.side-bottom{margin-top:auto;padding-top:1rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.65rem}
.authbox{display:flex;flex-direction:column;gap:.45rem}
.auth-row{display:flex;gap:.45rem}.auth-row .btn{flex:1;text-align:center}
.who{font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.theme-toggle{width:100%;text-align:center}
.mobile-bar{display:none;position:sticky;top:0;z-index:15;background:var(--surface);border-bottom:1px solid var(--line);padding:.65rem 1rem;align-items:center;gap:.8rem}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:18}
.content-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
main{max-width:1040px;width:100%;margin:0 auto;padding:1.75rem 1.5rem 4rem;flex:1}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;padding:.6rem 1.1rem;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--chili);color:#fff}
.btn.sm{padding:.35rem .75rem;font-size:.9rem}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2rem;align-items:center;padding:1.5rem 0}
.hero h1{font-size:clamp(2.1rem,5vw,3.6rem)}
.hero p{color:var(--muted);max-width:46ch;font-size:1.1rem}
.hero .art{aspect-ratio:1;border-radius:50% 50% 50% 8%;display:grid;place-items:center;font-size:7rem;background:linear-gradient(135deg,var(--gold),var(--chili))}
.stats{display:flex;gap:2rem;margin:1.5rem 0;flex-wrap:wrap}.stats b{font:700 1.8rem Fraunces,serif;display:block}.stats span{color:var(--muted);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.2rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .img{height:150px;display:grid;place-items:center;font-size:4.5rem}
.card .body{padding:1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.card h3{font-size:1.2rem;margin:0}.card p{margin:0;color:var(--muted);font-size:.93rem}
.meta{display:flex;gap:.8rem;color:var(--muted);font-size:.85rem;margin-top:auto;padding-top:.4rem}
.fav{position:absolute;top:.6rem;right:.6rem;background:var(--surface);border:0;border-radius:50%;width:2.2rem;height:2.2rem;cursor:pointer;font-size:1.1rem}
.tools{display:flex;gap:.7rem;flex-wrap:wrap;margin:1rem 0 1.5rem}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.55rem .8rem;width:100%}
.tools input{flex:1;min-width:200px;width:auto}.tools select{width:auto}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.3rem .9rem;cursor:pointer}
.chip.on{background:var(--gold);border-color:var(--gold);color:#2a1d00;font-weight:600}
.recipe-head{display:grid;grid-template-columns:260px 1fr;gap:1.5rem;align-items:center;margin-bottom:1.5rem}
.recipe-head .img{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:6rem}
.cols{display:grid;grid-template-columns:1fr 1.4fr;gap:2rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:1.2rem}
.panel ul,.panel ol{list-style:none;margin:0;padding:0}
.panel li{padding:.5rem 0;border-bottom:1px dashed var(--line);display:flex;gap:.7rem;align-items:flex-start}
.panel li:last-child{border:0}.done span{text-decoration:line-through;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem}.stepper button{width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.bartrack{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:.6rem 0}.bartrack i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.pill{display:inline-block;background:var(--line);border-radius:99px;padding:.1rem .7rem;font-size:.8rem}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem;margin-top:1rem}
.feat div{border-left:4px solid var(--gold);padding:.4rem 1rem;background:var(--surface);border-radius:0 10px 10px 0}
.feat b{display:block}.feat span{color:var(--muted);font-size:.92rem}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:.6rem;border-bottom:1px solid var(--line);text-align:left}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
.login{max-width:380px;margin:2rem auto}em.pill.adm{font-style:normal;background:var(--gold);color:#2a1d00}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
.emoji-row{display:flex;gap:.6rem;align-items:center}.emoji-row input{width:4.2rem;text-align:center;font-size:1.5rem;padding:.35rem}
.emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:.3rem;margin-top:.5rem;padding:.5rem;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.emoji-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:.25rem;font-size:1.25rem;cursor:pointer;line-height:1.2}
.emoji-btn:hover,.emoji-btn.on{border-color:var(--gold);background:var(--gold)}
.toast{position:fixed;bottom:calc(1rem + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:99px;z-index:30}
footer{text-align:center;color:var(--muted);padding:2rem 1rem;border-top:1px solid var(--line);font-size:.9rem}
.arch svg{width:100%;height:auto;min-width:640px}
@media(max-width:820px){
  .mobile-bar{display:flex}
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .22s ease;box-shadow:6px 0 24px rgba(0,0,0,.2)}
  .sidebar.open{transform:translateX(0)}
  .close-side{display:inline-block}
  .hero,.cols,.recipe-head{grid-template-columns:1fr}.hero .art{max-width:240px}.recipe-head .img{max-width:200px}
  .emoji-grid{grid-template-columns:repeat(6,1fr)}
}
@media print{.sidebar,.mobile-bar,.backdrop,footer,.noprint{display:none!important}main{padding:0}}
</style>
</head>
<body>
<div class="mobile-bar noprint">
  <button class="btn alt sm" id="menuBtn" aria-label="Open menu" aria-expanded="false">☰ Menu</button>
  <a class="logo" href="#home">🍲 Lutô Iloilo</a>
</div>
<div class="backdrop" id="backdrop" hidden></div>

<div class="shell">
  <aside class="sidebar noprint" id="sidebar" aria-label="Sidebar navigation and options">
    <div class="side-head">
      <a class="logo" href="#home">🍲 Lutô Iloilo</a>
      <button class="btn alt sm close-side" id="closeMenuBtn" aria-label="Close menu">✕</button>
    </div>
    <nav aria-label="Main">
      <a href="#home" data-r="home">🏠 Home</a>
      <a href="#recipes" data-r="recipes">📖 Recipes</a>
      <a href="#favorites" data-r="favorites">❤️ Saved</a>
      <a href="#architecture" data-r="architecture">🏗️ Architecture</a>
      <a href="#admin" data-r="admin" id="adminLink" hidden>⚙️ Admin</a>
    </nav>
    <div class="side-bottom">
      <div class="authbox" id="auth"></div>
      <button class="btn alt sm theme-toggle" id="themeBtn" aria-label="Toggle dark mode">🌓 Toggle Theme</button>
    </div>
  </aside>

  <div class="content-wrap">
    <main id="app"></main>
    <footer>Lutô Iloilo – a static cookbook of Iloilo City’s best-loved dishes. Maayo nga pagkaon!</footer>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const KEY='iloilo_recipes_v1',FAV='iloilo_favs_v1',USERS='iloilo_users_v1',SESS='iloilo_session_v1';
const grads={
  Soup:['#f6b93b','#e55039'],
  Noodles:['#fad390','#e58e26'],
  Meat:['#e55039','#8e2a1b'],
  Pastry:['#f8c291','#b8864b'],
  Chicken:['#78e08f','#38ada9'],
  Dessert:['#f8a5c2','#cf6a87'],
  Seafood:['#48dbfb','#0abde3'],
  Vegetables:['#a3cb38','#009432'],
  'Rice & Grains':['#f7d794','#cf6a87'],
  'Street Food':['#ff9f43','#ee5253'],
  Beverages:['#54a0ff','#2e86de'],
  Appetizer:['#feca57','#ff9f43']
};
const EMOJIS=[
  '🍲','🍜','🥟','🍖','🍗','🥩','🥓','🍤','🦐','🦀','🦞','🐟',
  '🦑','🦪','🍚','🍛','🥗','🥬','🌽','🍅','🍆','🌶️','🧄','🧅',
  '🥖','🥐','🍞','🥞','🧇','🥧','🍰','🍮','🍧','🍨','🥭','🥥'
];
const seed=[
{id:'la-paz-batchoy',name:'La Paz Batchoy',cat:'Soup',emoji:'🍜',time:60,serves:4,level:'Medium',desc:'Iloilo’s signature noodle soup, born in the La Paz market, with pork, liver and crunchy chicharon.',ing:[[250,'g','miki noodles'],[300,'g','pork shoulder'],[150,'g','pork liver'],[2,'L','pork bone broth'],[4,'cloves','garlic, minced'],[1,'','onion, sliced'],[3,'tbsp','shrimp paste (bagoong)'],[0,'','chicharon, spring onion, fried garlic to top'],[4,'','eggs (optional)']],steps:['Simmer pork shoulder in the broth for 45 minutes until tender, then slice thinly.','Sauté garlic and onion, add the bagoong, then pour in the strained broth.','Add the liver for the last 5 minutes so it stays soft; slice it.','Blanch the miki noodles for 1 minute and divide into bowls.','Top with pork, liver, crushed chicharon, spring onion and fried garlic. Ladle hot broth over and crack in a raw egg.']},
{id:'pancit-molo',name:'Pancit Molo',cat:'Soup',emoji:'🥟',time:75,serves:6,level:'Medium',desc:'Dumpling soup from the Molo district, a Chinese-Filipino comfort bowl served at every family gathering.',ing:[[250,'g','ground pork'],[100,'g','shrimp, minced'],[30,'','wonton wrappers'],[1.5,'L','chicken broth'],[3,'cloves','garlic'],[1,'','onion, chopped'],[2,'tbsp','soy sauce'],[0,'','salt, pepper, spring onion']],steps:['Mix pork, shrimp, half the onion, soy sauce and pepper into a filling.','Place a teaspoon of filling in each wrapper, moisten the edges and fold into dumplings.','Sauté garlic and the remaining onion, add broth and bring to a simmer.','Drop in the dumplings and cook 6 to 8 minutes until they float.','Season to taste and serve topped with spring onion and fried garlic.']},
{id:'kansi',name:'Kansi',cat:'Meat',emoji:'🍖',time:120,serves:5,level:'Easy',desc:'Bacolod’s bulalo meets Ilonggo sour: beef shank soup soured with batwan fruit and finished with lemongrass.',ing:[[1,'kg','beef shank with bone marrow'],[2,'L','water'],[2,'stalks','lemongrass, bruised'],[1,'thumb','ginger, sliced'],[6,'','batwan or 3 tbsp tamarind paste'],[1,'','jackfruit (langka), young, cubed'],[2,'tbsp','fish sauce'],[0,'','salt, pepper, green chili']],steps:['Boil the beef shank, discard the first scum water, then cover with fresh water.','Add ginger and lemongrass, then simmer on low for 1.5 hours until the meat is fork-tender.','Add young jackfruit and cook 15 more minutes.','Stir in batwan or tamarind to taste and season with fish sauce.','Serve piping hot with steamed rice.']},
{id:'tinuom-na-manok',name:'Tinuom na Manok',cat:'Chicken',emoji:'🍗',time:70,serves:4,level:'Easy',desc:'Chicken steamed in banana leaves with lemongrass, ginger and tomato, a Panay classic with a fragrant reveal.',ing:[[1,'kg','native chicken, cut up'],[3,'stalks','lemongrass'],[1,'thumb','ginger, sliced'],[2,'','tomatoes, wedged'],[1,'','onion, sliced'],[1,'handful','pepper leaves (sili leaves)'],[2,'tbsp','fish sauce'],[2,'','banana leaves, wilted over flame']],steps:['Wilt the banana leaves over a flame so they do not tear.','Layer lemongrass, ginger, onion and tomato on the leaf, then lay the chicken on top.','Season with fish sauce and add the chili leaves. Wrap tightly and tie.','Steam or cook over low charcoal for 50 to 60 minutes.','Unwrap at the table and eat with hot rice and the juices.']},
{id:'biscocho',name:'Biscocho',cat:'Pastry',emoji:'🥖',time:90,serves:12,level:'Medium',desc:'Twice-baked buttery bread slices dusted with sugar, the Iloilo pasalubong everyone brings home.',ing:[[3,'cups','all-purpose flour'],[1,'tbsp','yeast'],[0.5,'cup','sugar'],[1,'cup','warm milk'],[0.5,'cup','butter, softened'],[1,'','egg'],[0.5,'cup','extra butter + sugar for the topping']],steps:['Proof yeast with warm milk and a spoon of the sugar for 10 minutes.','Mix in flour, remaining sugar, egg and butter, then knead until smooth and let rise for 1 hour.','Shape into small loaves, rise again 30 minutes, then bake at 180°C for 25 minutes.','Slice thinly, brush with butter and sprinkle with sugar.','Return to a 150°C oven for 20 minutes until golden and crisp.']},
{id:'napoleones',name:'Napoleones',cat:'Pastry',emoji:'🥐',time:100,serves:10,level:'Hard',desc:'Flaky puff pastry fingers filled with custard and glazed white, a proud Iloilo bakery tradition.',ing:[[2,'cups','all-purpose flour'],[1,'cup','cold butter, for laminating'],[0.5,'cup','cold water'],[2,'cups','milk'],[0.5,'cup','sugar'],[4,'','egg yolks'],[3,'tbsp','cornstarch'],[1,'cup','powdered sugar for icing']],steps:['Make dough from flour, water and a pinch of salt. Rest 30 minutes.','Roll out, fold in the cold butter, and fold in thirds three times, chilling between folds.','Roll thin, cut into rectangles and bake at 200°C for 20 minutes until puffed and golden.','Cook milk, sugar, yolks and cornstarch into thick custard and chill.','Sandwich custard between two pastry layers and glaze the top with powdered sugar icing.']}
];
const $=s=>document.querySelector(s),app=$('#app');
const cloneSeed=()=>JSON.parse(JSON.stringify(seed));
const jget=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const jset=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let recipes=jget(KEY,null)||cloneSeed(),favs=jget(FAV,[]),users=jget(USERS,[]),sess=jget(SESS,null);
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
function setSess(u){sess={name:u.name,email:u.email,role:u.role};jset(SESS,sess)}
async function init(){if(!users.some(u=>u.role==='admin')){users.push({name:'Admin',email:'admin@lutoiloilo.ph',pw:await sha('admin123'),role:'admin'});jset(USERS,users)}route()}
function toggleMenu(open){const sb=$('#sidebar'),bd=$('#backdrop'),btn=$('#menuBtn');if(!sb)return;sb.classList.toggle('open',open);if(bd)bd.hidden=!open;if(btn)btn.setAttribute('aria-expanded',String(open))}
function renderAuth(){const a=$('#auth');a.innerHTML=sess?`<span class="who">👤 ${esc(sess.name.split(' ')[0])}${sess.role==='admin'?' <em class="pill adm">Admin</em>':''}</span><button class="btn alt sm" id="logout" style="width:100%">Sign out</button>`:`<div class="auth-row"><a class="btn alt sm" href="#login">Log in</a><a class="btn sm" href="#register">Register</a></div>`;$('#adminLink').hidden=!(sess&&sess.role==='admin')}
function authView(m){if(sess)return `<div class="panel login"><h1>You’re signed in</h1><p>Signed in as ${esc(sess.name)}.</p><p><a class="btn" href="#recipes">Browse recipes</a></p></div>`;const reg=m==='register';return `<div class="panel login"><h1>${reg?'Create your account':'Log in'}</h1><form id="${m}Form" novalidate>${reg?'<label for="a-name">Full name</label><input id="a-name" autocomplete="name">':''}<label for="a-email">Email</label><input id="a-email" type="email" autocomplete="email"><label for="a-pw">Password</label><input id="a-pw" type="password" autocomplete="${reg?'new-password':'current-password'}">${reg?'<label for="a-pw2">Confirm password</label><input id="a-pw2" type="password" autocomplete="new-password">':''}<p id="a-err" role="alert" style="color:var(--chili);min-height:1.4em;margin:.6rem 0 0"></p><p><button class="btn" type="submit" style="width:100%">${reg?'Register':'Log in'}</button></p></form><p style="color:var(--muted);text-align:center">${reg?'Already have an account? <a href="#login">Log in</a>':'New here? <a href="#register">Create an account</a>'}</p>${reg?'':'<p style="color:var(--muted);text-align:center;font-size:.85rem">Demo admin: admin@lutoiloilo.ph / admin123</p>'}</div>`}
const save=()=>jset(KEY,recipes);
let q='',cat='All',sort='name';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grad=c=>{const g=grads[c]||['#7fb7be','#0f4c5c'];return `background:linear-gradient(135deg,${g[0]},${g[1]})`};
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
function frac(n){const r=Math.round(n*4)/4,w=Math.floor(r),f=r-w,fs={0:'',.25:'¼',.5:'½',.75:'¾'};return (w||!f?w:'')+fs[f]}
function card(r){return `<article class="card"><a href="#recipe-${r.id}" style="text-decoration:none"><div class="img" style="${grad(r.cat)}" aria-hidden="true">${esc(r.emoji)}</div></a>
<button class="fav" data-fav="${r.id}" aria-label="Save ${esc(r.name)}">${favs.includes(r.id)?'❤️':'🤍'}</button>
<div class="body"><span class="pill" style="align-self:flex-start">${esc(r.cat)}</span><h3><a href="#recipe-${r.id}" style="text-decoration:none">${esc(r.name)}</a></h3><p>${esc(r.desc)}</p>
<div class="meta"><span>⏱ ${r.time} min</span><span>🍽 ${r.serves}</span><span>${esc(r.level)}</span></div></div></article>`}

function home(){const top=recipes.slice(0,3);return `<section class="hero"><div><h1>Cook the way Iloilo eats.</h1><p>Step-by-step tutorials for the dishes Iloilo City is famous for, from a steaming bowl of batchoy to a box of fresh biscocho.</p>
<p><a class="btn" href="#recipes">Browse recipes</a> <a class="btn alt" href="#architecture">How this site works</a></p>
<div class="stats"><div><b>${recipes.length}</b><span>tutorials</span></div><div><b>${favs.length}</b><span>saved by you</span></div><div><b>0</b><span>servers needed</span></div></div></div>
<div class="art" aria-hidden="true">🍲</div></section>
<h2>Start with these</h2><div class="grid">${top.map(card).join('')}</div>
<h2 style="margin-top:2.5rem">What you can do here</h2><div class="feat">
<div><b>Search and filter</b><span>Find a dish by name, category or cooking time.</span></div>
<div><b>Scale servings</b><span>Change the portions and the ingredient amounts adjust.</span></div>
<div><b>Cook along</b><span>Tick off ingredients and steps with a progress bar.</span></div>
<div><b>Save favorites</b><span>Keep your go-to recipes on the Saved page.</span></div>
<div><b>Print a recipe</b><span>A clean print layout for the kitchen counter.</span></div>
<div><b>Admin panel</b><span>Add, edit and delete recipes, then export a backup.</span></div></div>`}

function list(fav){let L=recipes.filter(r=>(!fav||favs.includes(r.id))&&(cat==='All'||r.cat===cat)&&(r.name+r.desc).toLowerCase().includes(q.toLowerCase()));
L.sort((a,b)=>sort==='time'?a.time-b.time:a.name.localeCompare(b.name));
const cats=['All',...new Set(recipes.map(r=>r.cat))];
return `<h1>${fav?'Saved recipes':'All recipes'}</h1><div class="tools"><input id="q" type="search" placeholder="Search recipes" aria-label="Search recipes" value="${esc(q)}">
<select id="sort" aria-label="Sort"><option value="name" ${sort==='name'?'selected':''}>Sort by name</option><option value="time" ${sort==='time'?'selected':''}>Sort by time</option></select></div>
<div class="tools">${cats.map(c=>`<button class="chip ${c===cat?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>
<div class="grid" id="results">${L.length?L.map(card).join(''):`<p>${fav?'Nothing saved yet. Tap the heart on a recipe to keep it here.':'No recipes match. Try a different search or category.'}</p>`}</div>`}

function recipe(id){const r=recipes.find(x=>x.id===id);if(!r)return '<h1>Recipe not found</h1><a class="btn" href="#recipes">Back to recipes</a>';
const key='iloilo_prog_'+id,st=jget(key,{s:r.serves,i:[],p:[]});window._r=r;window._st=st;window._key=key;return `<p><a href="#recipes">&larr; All recipes</a></p>
<div class="recipe-head"><div class="img" style="${grad(r.cat)}" aria-hidden="true">${esc(r.emoji)}</div><div><span class="pill">${esc(r.cat)}</span><h1>${esc(r.name)}</h1><p>${esc(r.desc)}</p>
<div class="meta"><span>⏱ ${r.time} min</span><span>${esc(r.level)}</span></div><p class="noprint"><button class="btn sm" data-fav="${r.id}">${favs.includes(r.id)?'❤️ Saved':'🤍 Save recipe'}</button> <button class="btn alt sm" onclick="print()">Print</button></p></div></div>
<div class="cols"><div class="panel"><h2>Ingredients</h2><div class="stepper"><button data-sv="-1" aria-label="Fewer servings">−</button><b id="sv"></b><button data-sv="1" aria-label="More servings">+</button><span>servings</span></div><ul id="ings"></ul></div>
<div class="panel"><h2>Method</h2><div class="bartrack"><i id="bar"></i></div><ol id="steps"></ol></div></div>`}
function paint(){const r=window._r,st=window._st;if(!r)return;$('#sv').textContent=st.s;const m=st.s/r.serves;
$('#ings').innerHTML=r.ing.map((x,i)=>`<li class="${st.i.includes(i)?'done':''}"><input type="checkbox" style="width:auto;margin-top:.3rem" data-i="${i}" ${st.i.includes(i)?'checked':''} id="i${i}"><label for="i${i}" style="margin:0;font-weight:400"><span>${x[0]?frac(x[0]*m)+' ':''}${esc((x[1]?x[1]+' ':'')+x[2])}</span></label></li>`).join('');
$('#steps').innerHTML=r.steps.map((s,i)=>`<li class="${st.p.includes(i)?'done':''}"><input type="checkbox" style="width:auto;margin-top:.3rem" data-p="${i}" ${st.p.includes(i)?'checked':''} id="p${i}"><label for="p${i}" style="margin:0;font-weight:400"><b>Step ${i+1}.</b> <span>${esc(s)}</span></label></li>`).join('');
$('#bar').style.width=Math.round(st.p.length/r.steps.length*100)+'%';jset(window._key,st)}

function arch(){return `<h1>System architecture</h1><p style="color:var(--muted);max-width:62ch">This site is fully static: three files’ worth of HTML, CSS and JavaScript served from any web host. There is no backend. Recipe data and your saves live in the visitor’s browser.</p>
<div class="panel scroll arch"><svg viewBox="0 0 760 330" role="img" aria-label="Architecture diagram: browser loads static files from a host; JavaScript renders views and stores data in localStorage">
<defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="currentColor"/></marker></defs>
<g font-family="Figtree,sans-serif" font-size="14" fill="currentColor" style="color:var(--ink)">
<rect x="20" y="120" width="140" height="80" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><text x="90" y="155" text-anchor="middle" font-weight="700">Visitor</text><text x="90" y="178" text-anchor="middle" font-size="12">Phone or laptop</text>
<rect x="230" y="20" width="200" height="290" rx="14" fill="var(--bg)" stroke="var(--brand)" stroke-width="2"/><text x="330" y="48" text-anchor="middle" font-weight="700">Browser</text>
<rect x="250" y="64" width="160" height="50" rx="8" fill="var(--gold)"/><text x="330" y="94" text-anchor="middle" fill="#2a1d00">UI: HTML + CSS</text>
<rect x="250" y="130" width="160" height="50" rx="8" fill="var(--leaf)"/><text x="330" y="160" text-anchor="middle" fill="#fff">Router + views (JS)</text>
<rect x="250" y="196" width="160" height="50" rx="8" fill="var(--chili)"/><text x="330" y="226" text-anchor="middle" fill="#fff">Auth + admin (JS)</text>
<rect x="250" y="258" width="160" height="40" rx="8" fill="var(--brand)"/><text x="330" y="283" text-anchor="middle" fill="var(--brand-ink)">localStorage</text>
<rect x="540" y="60" width="190" height="90" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><text x="635" y="95" text-anchor="middle" font-weight="700">Static web host</text><text x="635" y="118" text-anchor="middle" font-size="12">GitHub Pages, Netlify, etc.</text>
<rect x="540" y="200" width="190" height="90" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><text x="635" y="235" text-anchor="middle" font-weight="700">Backup file</text><text x="635" y="258" text-anchor="middle" font-size="12">recipes.json export/import</text>
<g stroke="currentColor" stroke-width="2" fill="none" marker-end="url(#ar)"><path d="M160 160H228"/><path d="M432 100C480 100 490 105 538 105"/><path d="M412 278C470 278 480 250 538 248"/></g>
<text x="194" y="150" text-anchor="middle" font-size="12">opens</text><text x="485" y="92" text-anchor="middle" font-size="12">loads files</text><text x="480" y="270" text-anchor="middle" font-size="12">export</text></g></svg></div>
<div class="feat" style="margin-top:1.5rem"><div><b>Presentation layer</b><span>Semantic HTML with responsive CSS and a dark mode.</span></div><div><b>Application layer</b><span>A hash router switches Home, Recipes, Recipe, Saved, Architecture and Admin views.</span></div><div><b>Data layer</b><span>Seed recipes ship in the script; admin changes are saved in localStorage.</span></div><div><b>Roles</b><span>Visitors browse and save, can register or log in as members, and only the admin account can manage recipes.</span></div></div>
<p style="color:var(--muted)">Note: accounts are stored in the visitor’s own browser with hashed passwords. This is a front-end demo only; for real protection, add a backend with authentication later.</p>`}

function adminView(){if(!sess)return `<div class="panel login"><h1>Admin area</h1><p>Log in with an admin account to manage recipes.</p><p><a class="btn" href="#login">Log in</a></p></div>`;
if(sess.role!=='admin')return `<div class="panel login"><h1>Admins only</h1><p>You are signed in as ${esc(sess.name)}, a regular member. Only admins can manage recipes.</p><p><a class="btn" href="#recipes">Back to recipes</a></p></div>`;
const allCats=[...new Set([...Object.keys(grads),...recipes.map(r=>r.cat)])];
return `<h1>Admin dashboard</h1><p style="color:var(--muted)">Signed in as ${esc(sess.name)}. Use Sign out in the sidebar when you are done.</p><div class="stats"><div><b>${recipes.length}</b><span>recipes</span></div><div><b>${new Set(recipes.map(r=>r.cat)).size}</b><span>categories</span></div><div><b>${Math.round(recipes.reduce((a,r)=>a+r.time,0)/recipes.length||0)}</b><span>avg minutes</span></div><div><b>${users.filter(u=>u.role!=='admin').length}</b><span>members</span></div></div>
<p><button class="btn alt sm" id="export">Export JSON</button> <label class="btn alt sm" style="display:inline-block;margin:0;cursor:pointer">Import JSON<input id="import" type="file" accept=".json" hidden></label> <button class="btn alt sm" id="reset">Restore defaults</button></p>
<div class="cols"><div class="panel scroll"><h2>Recipes</h2><table><tbody>${recipes.map(r=>`<tr><td>${esc(r.emoji)} <strong>${esc(r.name)}</strong><br><small style="color:var(--muted)">${esc(r.cat)} • ${r.time}m • ${esc(r.level)}</small></td><td style="white-space:nowrap"><button class="btn alt sm" data-edit="${r.id}">Edit</button> <button class="btn danger sm" data-del="${r.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>
<div class="panel"><h2 id="ftitle">Add a recipe</h2><form id="rf"><input type="hidden" id="f-id">
<label for="f-name">Name</label><input id="f-name" required>
<div class="form-row"><div><label for="f-cat">Category</label><input id="f-cat" list="cl" required value="Soup" placeholder="Choose or type new..."><datalist id="cl">${allCats.map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
<div><label for="f-cat-pick">Quick category select</label><select id="f-cat-pick" aria-label="Quick category select">${allCats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div></div>
<label for="f-emoji">Emoji icon (type or click below)</label>
<div class="emoji-row"><input id="f-emoji" value="🍲" maxlength="4" aria-label="Selected emoji"><span style="color:var(--muted);font-size:.88rem">Pick an icon or paste any food emoji</span></div>
<div class="emoji-grid" role="group" aria-label="Emoji picker">${EMOJIS.map(em=>`<button type="button" class="emoji-btn${em==='🍲'?' on':''}" data-pick-emoji="${em}" title="Use ${em}">${em}</button>`).join('')}</div>
<div class="form-row"><div><label for="f-time">Minutes</label><input id="f-time" type="number" min="1" value="45"></div><div><label for="f-serves">Servings</label><input id="f-serves" type="number" min="1" value="4"></div></div>
<label for="f-level">Difficulty</label><select id="f-level"><option value="Easy">Easy</option><option value="Medium" selected>Medium</option><option value="Hard">Hard</option></select>
<label for="f-desc">Short description</label><textarea id="f-desc" rows="2" required></textarea><label for="f-ing">Ingredients (one per line, e.g. “2 cups rice”)</label><textarea id="f-ing" rows="5" required></textarea>
<label for="f-steps">Steps (one per line)</label><textarea id="f-steps" rows="5" required></textarea><p><button class="btn" type="submit">Save recipe</button> <button class="btn alt" type="button" id="cancel">Cancel</button></p></form></div></div>`}

function route(){const h=(location.hash||'#home').slice(1);window._r=null;let v,tab=h;
if(h==='home')v=home();else if(h==='recipes')v=list(false);else if(h==='favorites')v=list(true);else if(h==='architecture')v=arch();else if(h==='admin')v=adminView();else if(h==='login')v=authView('login');else if(h==='register')v=authView('register');
else if(h.startsWith('recipe-')){v=recipe(h.slice(7));tab='recipes'}else{v=home();tab='home'}
app.innerHTML=v;renderAuth();toggleMenu(false);document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===tab));if(window._r)paint();window.scrollTo(0,0)}
function relist(){const y=window.scrollY;route();window.scrollTo(0,y)}
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'recipe';
function parseIng(t){return t.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const m=l.match(/^(\d+(?:\.\d+)?)\s*(\S+)?\s*(.*)$/);return m?[+m[1],m[2]||'',m[3]||'']:[0,'',l]})}
function ingText(r){return r.ing.map(x=>[x[0]||'',x[1],x[2]].filter(Boolean).join(' ')).join('\n')}
function syncEmojiHighlight(val){document.querySelectorAll('.emoji-btn').forEach(b=>b.classList.toggle('on',b.dataset.pickEmoji===val))}

document.addEventListener('click',e=>{if(e.target.id==='backdrop'){toggleMenu(false);return}const t=e.target.closest('button,[data-fav]');if(!t)return;const d=t.dataset;
if(t.id==='menuBtn'){toggleMenu(true)}
else if(t.id==='closeMenuBtn'){toggleMenu(false)}
else if(d.pickEmoji){$('#f-emoji').value=d.pickEmoji;syncEmojiHighlight(d.pickEmoji)}
else if(d.fav){const i=favs.indexOf(d.fav);i<0?favs.push(d.fav):favs.splice(i,1);jset(FAV,favs);toast(i<0?'Saved to your list':'Removed from saved');relist()}
else if(d.cat){cat=d.cat;relist()}
else if(d.sv){const s=window._st;s.s=Math.max(1,s.s+ +d.sv);paint()}
else if(t.id==='logout'){sess=null;jset(SESS,null);toast('You have signed out');if(location.hash==='#home')route();else location.hash='#home'}
else if(t.id==='cancel'){route()}
else if(d.del){if(confirm('Delete this recipe?')){recipes=recipes.filter(r=>r.id!==d.del);save();toast('Deleted');route()}}
else if(d.edit){const r=recipes.find(x=>x.id===d.edit);$('#ftitle').textContent='Edit recipe';$('#f-id').value=r.id;$('#f-name').value=r.name;$('#f-cat').value=r.cat;if($('#f-cat-pick'))$('#f-cat-pick').value=r.cat;$('#f-emoji').value=r.emoji;syncEmojiHighlight(r.emoji);$('#f-time').value=r.time;$('#f-serves').value=r.serves;$('#f-level').value=r.level||'Medium';$('#f-desc').value=r.desc;$('#f-ing').value=ingText(r);$('#f-steps').value=r.steps.join('\n');$('#rf').scrollIntoView({behavior:'smooth'})}
else if(t.id==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(recipes,null,2)],{type:'application/json'}));a.download='recipes.json';a.click()}
else if(t.id==='reset'){if(confirm('Restore the original recipes?')){recipes=cloneSeed();save();route()}}
else if(t.id==='themeBtn'){const cur=document.documentElement.dataset.theme,sysDark=matchMedia('(prefers-color-scheme: dark)').matches,isDark=cur?cur==='dark':sysDark;document.documentElement.dataset.theme=isDark?'light':'dark'}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.i!==undefined||d.p!==undefined){const s=window._st,k=d.i!==undefined?'i':'p',n=+d[k],a=s[k];t.checked?a.push(n):a.splice(a.indexOf(n),1);paint()}
else if(t.id==='f-cat-pick'){$('#f-cat').value=t.value}
else if(t.id==='sort'){sort=t.value;relist()}
else if(t.id==='import'){const f=t.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);if(!Array.isArray(j)||!j.every(r=>r&&r.id&&r.name&&Array.isArray(r.ing)&&Array.isArray(r.steps)))throw 0;recipes=j;save();toast('Imported');route()}catch(er){toast('That file is not a valid recipes.json')}})}});
document.addEventListener('input',e=>{if(e.target.id==='f-emoji'){syncEmojiHighlight(e.target.value.trim())}else if(e.target.id==='f-cat'&&$('#f-cat-pick')){const opt=[...$('#f-cat-pick').options].find(o=>o.value.toLowerCase()===e.target.value.trim().toLowerCase());if(opt)$('#f-cat-pick').value=opt.value}else if(e.target.id==='q'){q=e.target.value;const L=recipes.filter(r=>(cat==='All'||r.cat===cat)&&(r.name+r.desc).toLowerCase().includes(q.toLowerCase()));
if((location.hash||'')==='#favorites'){relist();$('#q').focus();return}
$('#results').innerHTML=L.length?L.map(card).join(''):'<p>No recipes match. Try a different search or category.</p>'}});
document.addEventListener('submit',e=>{if(e.target.id!=='rf')return;e.preventDefault();
const id0=$('#f-id').value,name=$('#f-name').value.trim();let id=id0||slug(name);if(!id0&&recipes.some(r=>r.id===id))id+='-'+Date.now()%1000;
const r={id,name,cat:$('#f-cat').value.trim()||'Uncategorized',emoji:$('#f-emoji').value.trim()||'🍲',time:+$('#f-time').value||30,serves:+$('#f-serves').value||4,level:$('#f-level').value||'Medium',desc:$('#f-desc').value.trim(),ing:parseIng($('#f-ing').value),steps:$('#f-steps').value.split('\n').map(s=>s.trim()).filter(Boolean)};
const i=recipes.findIndex(x=>x.id===id0);i>=0?(recipes[i]=r):recipes.push(r);save();toast('Recipe saved');route()});
document.addEventListener('submit',async e=>{const id=e.target.id;if(id!=='loginForm'&&id!=='registerForm')return;e.preventDefault();const err=m=>{$('#a-err').textContent=m};const email=$('#a-email').value.trim().toLowerCase(),pw=$('#a-pw').value;
if(!/^\S+@\S+\.\S+$/.test(email))return err('Enter a valid email address.');
if(pw.length<6)return err('Password must be at least 6 characters.');
const h=await sha(pw);
if(id==='registerForm'){const name=$('#a-name').value.trim();if(!name)return err('Enter your name.');if(pw!==$('#a-pw2').value)return err('Passwords do not match.');if(users.some(u=>u.email===email))return err('That email is already registered. Try logging in.');const u={name,email,pw:h,role:'member'};users.push(u);jset(USERS,users);setSess(u);toast('Welcome, '+name+'!');location.hash='#recipes'}
else{const u=users.find(x=>x.email===email&&x.pw===h);if(!u)return err('Email or password is incorrect.');setSess(u);toast('Welcome back, '+u.name);location.hash=u.role==='admin'?'#admin':'#recipes'}});
addEventListener('hashchange',route);init();
</script>
</body>
